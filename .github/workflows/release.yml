name: release

on:
  push:
    tags:
      - "v*"
  # bump.yml dispatches this on the tag ref: a tag pushed with GITHUB_TOKEN
  # does not trigger workflows on its own.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

# One release at a time. Two overlapping runs would both upload assets to
# the same tag and race on the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality gate (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The desktop shell is gated here too, and it links against GTK and
      # WebKit: without these the clippy step dies on glib-sys before it
      # compiles a line of our code.
      - name: install desktop system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file

      - uses: Swatinem/rust-cache@v2.9.2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --exclude vobes-desktop --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude vobes-desktop

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: install frontend deps
        working-directory: desktop
        run: bun install --frozen-lockfile

      # Before clippy, not after: `tauri::generate_context!` refuses to
      # compile when `frontendDist` (`../dist`) is missing, and the dist
      # only exists once the frontend has been built.
      - name: build frontend
        working-directory: desktop
        run: bun run build

      - name: clippy desktop
        working-directory: desktop
        run: cargo clippy -p vobes-desktop --all-targets -- -D warnings

      - name: lint frontend
        working-directory: desktop
        run: bun run lint

      - name: type check frontend
        working-directory: desktop
        run: bunx svelte-check --tsconfig ./tsconfig.json

      - name: test frontend
        working-directory: desktop
        run: bun test

      - name: the tag is on main
        run: |
          set -euo pipefail
          # `push: tags` accepts a tag on any commit, including a branch
          # or a detached commit that never reached main. Refuse to ship
          # code that main does not have.
          if ! git fetch --quiet origin main; then
            echo "::notice::could not fetch main; skipping the ancestry check"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main — refusing to release"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"

  release:
    name: release (${{ matrix.platform }})
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-22.04-arm
            platform: linux-arm
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: install mac targets (universal)
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: install linux deps (x64)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xdg-utils build-essential curl wget file

      - name: install linux deps (arm64)
        if: matrix.platform == 'linux-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xdg-utils build-essential curl wget file

      - name: install frontend deps
        working-directory: desktop
        run: bun install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: build + publish desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional, uncomment + add secrets to enable):
          # macOS:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows:
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Update signing — required for the in-app updater to accept a build:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Vobes ${{ github.ref_name }} Pre-alpha"
          releaseBody: |
            Vobes ${{ github.ref_name }} — Pre-alpha.

            Desktop app (unsigned): expect Gatekeeper / SmartScreen warnings on first run.
            macOS desktop bundle is universal (arm64 + x64).
            Linux desktop: x64 and arm64 (deb + appimage).
            CLI: `cargo install vobes-cli` (or `cargo install vobes-mcp` for the agent server).
            The CLI crates are published before this release is tagged, so the
            version on crates.io is the one this tag was cut from.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}