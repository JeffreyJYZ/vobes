name: bump

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  # Needed to dispatch release.yml after tagging.
  actions: write

# Two bump runs must not race: both would try to publish the same crate
# version, and one would fail on "version already exists".
concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A hung publish must not hold a runner for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are needed: the diff window is the last release tag, so a
          # crate version bump that was never published is still retried.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: read commit message + diff versions
        id: inspect
        run: |
          set -euo pipefail
          # [release] marker in the subject line forces a tag even when
          # no version literal moved. Anchored on subject only — a body
          # that mentions the marker (e.g. documenting the feature)
          # must not trip it. Exact literal match; use [release] only.
          SUBJECT=$(git log -1 --pretty=%s HEAD)
          MARKER=0
          echo "$SUBJECT" | grep -qF '[release]' && MARKER=1 || true

          # Desktop version is the tag (per AGENTS.md "tag only when desktop
          # version changed"). Three literals carry it — the Rust manifest,
          # the npm manifest and the Tauri config — and the updater compares
          # the one in tauri.conf.json. Read that one and refuse to tag if
          # the three disagree: a drifted tag publishes an app that never
          # sees its own update.
          NEW_DESKTOP=$(grep -E '"version"' desktop/src-tauri/tauri.conf.json \
            | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          CARGO_DESKTOP=$(grep -E '^version' desktop/src-tauri/Cargo.toml \
            | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          NPM_DESKTOP=$(grep -E '"version"' desktop/package.json \
            | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ "$NEW_DESKTOP" != "$CARGO_DESKTOP" ] || [ "$NEW_DESKTOP" != "$NPM_DESKTOP" ]; then
            echo "::error::desktop version literals disagree: tauri=$NEW_DESKTOP cargo=$CARGO_DESKTOP npm=$NPM_DESKTOP"
            exit 1
          fi
          # The window is the last release tag, not HEAD~1: a version bump
          # that lands in one commit and something else in the next would
          # otherwise be invisible, and a publish that failed (or was
          # skipped) was never retried because the next diff no longer
          # contained the bump. This applied to the desktop version too —
          # v0.1.14 was bumped one commit and shipped the next, so the tag
          # never got cut.
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            DIFF_RANGE="$BASE..HEAD"
          else
            DIFF_RANGE="HEAD~1..HEAD"
          fi
          OLD_DESKTOP=$(git show "$BASE":desktop/src-tauri/tauri.conf.json \
            2>/dev/null | grep -E '"version"' | head -1 \
            | sed -E 's/.*"([0-9.]+)".*/\1/' || echo "")

          # Find every workspace crate whose version moved. Output format:
          #   " name@version name@version ..."
          BUMPED=""
          echo "Diff range: $DIFF_RANGE"
          for f in $(git diff --name-only $DIFF_RANGE -- 'crates/*/Cargo.toml'); do
            [ -f "$f" ] || continue
            N=$(grep -E '^version' "$f" | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
            O=$(git show "$BASE":"$f" 2>/dev/null \
              | grep -E '^version' | head -1 \
              | sed -E 's/.*"([0-9.]+)".*/\1/' || echo "")
            if [ -n "$O" ] && [ "$N" != "$O" ]; then
              BUMPED="$BUMPED $(basename "$(dirname "$f")")@$N"
            fi
          done

          DESKTOP_BUMPED=0
          if [ -n "$OLD_DESKTOP" ] && [ "$NEW_DESKTOP" != "$OLD_DESKTOP" ]; then
            DESKTOP_BUMPED=1
          fi

          echo "marker=$MARKER"                >> "$GITHUB_OUTPUT"
          echo "desktop_version=$NEW_DESKTOP"  >> "$GITHUB_OUTPUT"
          echo "desktop_bumped=$DESKTOP_BUMPED" >> "$GITHUB_OUTPUT"
          echo "bumped_crates=$BUMPED"         >> "$GITHUB_OUTPUT"

      - name: publish bumped crates to crates.io
        # crates.io versions are immutable, so a publish cannot be undone.
        # Require a deliberate release commit: one that moves a version AND
        # carries the [release] marker in its subject. A version bump in an
        # ordinary commit stays local until the user marks it.
        if: >
          contains(steps.inspect.outputs.bumped_crates, '@') &&
          steps.inspect.outputs.desktop_bumped == '1'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Desktop publish path is the tag-driven tauri-action in
          # release.yml. This step covers per-crate bumps that don't need a
          # tag — see AGENTS.md.
          #
          # Idempotent on purpose: a version that is already on the registry
          # is skipped instead of failing the run (a local `cargo publish`,
          # a re-run, or two bumped crates resolving out of order all land
          # here). The token comes from the env var cargo reads itself; the
          # old `--token` flag is deprecated.
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set — cannot publish"
            exit 1
          fi
          echo "Bumped:${{ steps.inspect.outputs.bumped_crates }}"
          # `cargo info` is useless as a registry probe from inside the
          # workspace: it resolves the local member and exits 0 for a
          # version that was never published. Ask crates.io directly,
          # from a scratch directory, so the answer is about the registry.
          probe_registry() {
            local name=$1 ver=$2 dir
            dir=$(mktemp -d)
            if ( cd "$dir" && cargo info "$name@$ver" >/dev/null 2>&1 ); then
              return 0
            fi
            return 1
          }
          # Fixed dependency order: cargo refuses to publish a crate whose
          # newly-bumped dependency is not on the registry yet, and the
          # bump list arrives in path order (vobes-cli first).
          published=""
          failed=""
          for name in vobes-core vobes-config vobes-git vobes-scan vobes-store vobes-cli vobes-mcp; do
            ver=""
            for spec in ${{ steps.inspect.outputs.bumped_crates }}; do
              if [ "${spec%@*}" = "$name" ]; then
                ver=${spec#*@}
              fi
            done
            if [ -z "$ver" ]; then
              continue
            fi
            if probe_registry "$name" "$ver"; then
              echo "::notice::$name $ver already on crates.io; skipping."
              published="$published $name@$ver"
              continue
            fi
            echo "Publishing $name $ver…"
            # The registry index lags a publish by a short while, so a
            # dependent published immediately after its dependency is
            # rejected as "no matching package". Retry before giving up.
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "$name"; then
                ok=1
                break
              fi
              echo "::warning::$name $ver publish attempt $attempt failed; waiting for the registry index."
              sleep 30
            done
            if [ "$ok" = "1" ]; then
              published="$published $name@$ver"
            else
              # One failure must not abort the loop: the remaining crates
              # would never publish and the job would just go red.
              echo "::error::$name $ver could not be published."
              failed="$failed $name@$ver"
            fi
          done
          echo "Published:$published"
          if [ -n "$failed" ]; then
            echo "::error::Failed to publish:$failed"
            exit 1
          fi

      - name: tag release
        if: >
          steps.inspect.outputs.desktop_bumped == '1' ||
          steps.inspect.outputs.marker == '1'
        env:
          TAG: v${{ steps.inspect.outputs.desktop_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Check the remote, not local — `git rev-parse` only sees
          # the shallow clone's tags, which never include pre-existing
          # remote ones.
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "::notice::Tag $TAG already exists on origin; not re-pushing."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # A tag pushed with GITHUB_TOKEN does NOT trigger other workflows
          # (GitHub's anti-recursion rule), so release.yml would never run.
          # Dispatch it explicitly on the tag ref — but only when there is
          # no release for that tag yet. Unconditionally dispatching made a
          # dropped dispatch recoverable, and also rebuilt a release that
          # already existed every time a later commit moved.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release; not re-dispatching."
            exit 0
          fi
          gh workflow run release.yml --ref "$TAG"
