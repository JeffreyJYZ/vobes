name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt + clippy + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: install sccache
        shell: bash
        env:
          SCCACHE_VERSION: "0.10.0"
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)
              archive="sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              ;;
            macOS)
              archive="sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz"
              ;;
            Windows)
              archive="sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc.zip"
              ;;
          esac
          url="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${archive}"
          dest="/tmp/sccache-bin"
          rm -rf "$dest"
          mkdir -p "$dest"
          curl -fsSL "$url" -o "/tmp/${archive}"
          tar -xf "/tmp/${archive}" -C "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          sccache --version

      - name: fmt check
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo fmt --all -- --check

      - name: clippy
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy --workspace --exclude vobes-desktop --all-targets -- -D warnings

      - name: test
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo test --workspace --exclude vobes-desktop

      - name: build release (sanity)
        if: always()
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --release -p vobes-cli

  desktop:
    name: desktop (tauri build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
            deps: >-
              libwebkit2gtk-4.1-dev
              libgtk-3-dev
              libayatana-appindicator3-dev
              librsvg2-dev
              libsoup-3.0-dev
              libjavascriptcoregtk-4.1-dev
              build-essential
              curl
              wget
              file
          - os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: install linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.deps }}

      - name: install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: install sccache
        shell: bash
        env:
          SCCACHE_VERSION: "0.10.0"
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)
              archive="sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              ;;
            macOS)
              archive="sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz"
              ;;
            Windows)
              archive="sccache-v${SCCACHE_VERSION}-x86_64-pc-windows-msvc.zip"
              ;;
          esac
          url="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${archive}"
          dest="/tmp/sccache-bin"
          rm -rf "$dest"
          mkdir -p "$dest"
          curl -fsSL "$url" -o "/tmp/${archive}"
          tar -xf "/tmp/${archive}" -C "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          sccache --version

      - name: build frontend
        working-directory: desktop
        run: pnpm build

      - name: clippy desktop
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy -p vobes-desktop --all-targets -- -D warnings

      - name: build desktop (debug)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build -p vobes-desktop