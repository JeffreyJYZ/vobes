[package]
name = "vobes-desktop"
description = "Vobes — desktop command center."
version = "0.1.6"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
vobes-core = { workspace = true }
vobes-config = { workspace = true }
vobes-scan = { workspace = true }
vobes-git = { workspace = true }
vobes-store = { workspace = true }
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
once_cell = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]