# Example Vobes configuration.
# Real config lives at:
#   macOS:   ~/Library/Application Support/vobes/config.toml
#   Linux:   ~/.config/vobes/config.toml
#   Windows: %APPDATA%\vobes\config.toml
# Debug builds append "-dev" to the directory name so `cargo tauri dev`
# can't overwrite an installed release. `vbs init` writes a default
# there for you.

[general]
name = "My Workspace"

[scan]
roots = ["~/dev", "~/work"]
exclude = ["scratch", "experiments", "tmp"]
max_depth = 4
follow_symlinks = false

[display]
theme = "auto"
date_format = "relative"
default_sort = "last_modified"

[git]
cache_ttl_seconds = 60
fetch_upstream = false

[export]
format = "json"

[desktop]
notify_behind = false
launch_on_login = false